<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Cover Container — Demo</title>
  <script src="./src/AlbumCoverContainer.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #777777;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 48px;
    }

    #stage {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
    }

    .album-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .album-label {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Album Cover Container</h1>

  <div id="stage">

    <span id="album-container-rock" class="album-slot">
      <script>
        (function() {
          const options = {width: 260, height: 360, padding: 10, borderRadius: 12, gradientIntensity: 15};
          const container = new AlbumCoverContainer('assets/example-album-rock.png', options);
          document.currentScript.parentElement.appendChild(container.render());
        })();
      </script>
    </span>

    <span id="album-container-electronic" class="album-slot">
      <script>
        (function() {
          const options = {width: 300, height: 400, padding: 10, borderRadius: 12, gradientIntensity: 25};
          const container = new AlbumCoverContainer('assets/example-album-electronic.png', options);
          document.currentScript.parentElement.appendChild(container.render());
        })();
      </script>
    </span>

    <span id="album-container-hiphop" class="album-slot">
      <script>
        (function() {
          const options = {width: 260, height: 460, padding: 10, borderRadius: 20, gradientIntensity: 40};
          const container = new AlbumCoverContainer('assets/example-album-hip-hop.png', options);
          document.currentScript.parentElement.appendChild(container.render());
        })();
      </script>
    </span>

  </div>

</body>
</html>
